<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>10年ぶりの100の質問</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 18px;
      background: #111;
      color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #999;
      margin-bottom: 28px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }

    .filter-button {
      border: 1px solid #555;
      background: transparent;
      color: #ddd;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 15px;
    }

    .filter-button.active {
      background: #f5f5f5;
      color: #111;
      border-color: #f5f5f5;
    }

    .question-card {
      min-height: 250px;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 24px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      margin-bottom: 24px;
    }

    .number {
      color: #888;
      font-size: 13px;
      margin-bottom: 16px;
    }

    #question {
      font-size: 25px;
      line-height: 1.55;
      font-weight: 600;
    }

    #tags {
      margin-top: 22px;
      color: #999;
      font-size: 13px;
    }

    .draw-button {
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;

      background: white;
      color: black;

      font-size: 19px;
      font-weight: bold;
    }

    .status {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-top: 16px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>10年ぶりの100の質問</h1>
  <div class="subtitle">
    10年ぶりに会った人間に、何を聞く？
  </div>

  <div class="filters">

    <button class="filter-button" data-tag="サブカル">
      サブカル
    </button>

    <button class="filter-button" data-tag="人生とは">
      人生とは
    </button>

    <button class="filter-button" data-tag="野望">
      野望
    </button>

    <button class="filter-button" data-tag="あの頃に帰れたら">
      あの頃に帰れたら
    </button>

    <button class="filter-button" data-tag="自分語り">
      自分語り
    </button>

    <button class="filter-button" data-tag="オレと東京">
      オレと東京
    </button>

  </div>


  <div class="question-card">

    <div class="number">
      QUESTION <span id="number">—</span>
    </div>

    <div id="question">
      カテゴリを選ぶか、そのまま引いてください。
    </div>

    <div id="tags"></div>

  </div>


  <button id="draw" class="draw-button">
    🎲 質問を引く
  </button>


  <div class="status">
    候補：<span id="candidate-count">0</span>問
  </div>

</div>


<script>

const questions = [

  {
    text: "サブカルって、いつから「サブ」じゃなくなったと思います？",
    tags: ["サブカル", "人生とは"]
  },

  {
    text: "昔好きだったけど、今見るときつい作品あります？",
    tags: ["サブカル", "あの頃に帰れたら"]
  },

  {
    text: "人生で一番金を使ったオタク分野は？",
    tags: ["サブカル", "自分語り"]
  },

  {
    text: "40歳の私に「今のうちにやっとけ」と言いたいことは？",
    tags: ["人生とは", "自分語り"]
  },

  {
    text: "20歳に戻れるけど記憶はそのまま。戻ります？",
    tags: ["あの頃に帰れたら", "人生とは", "自分語り"]
  },

  {
    text: "100歳まで健康確定なら、何を始めます？",
    tags: ["野望", "人生とは"]
  },

  {
    text: "宝くじで10億円当たったら、東京に残ります？",
    tags: ["野望", "オレと東京", "自分語り"]
  },

  {
    text: "東京で一生行かなくても困らない街は？",
    tags: ["オレと東京"]
  },

  {
    text: "山手線で一番信用してる駅は？",
    tags: ["オレと東京"]
  },

  {
    text: "この10年で一番「まさかこうなるとは」と思ったことは？",
    tags: ["自分語り", "あの頃に帰れたら"]
  },

  {
    text: "自分の人生にタイトルをつけるなら、今のところ何です？",
    tags: ["人生とは", "自分語り"]
  },

  {
    text: "今から大学に入り直すなら何を専攻します？",
    tags: ["野望", "あの頃に帰れたら"]
  }

];


// 現在選択されているタグ
const selectedTags = new Set();


// 一度引いた質問を記録
const usedQuestions = new Set();


const filterButtons =
  document.querySelectorAll(".filter-button");

const drawButton =
  document.getElementById("draw");

const questionElement =
  document.getElementById("question");

const numberElement =
  document.getElementById("number");

const tagsElement =
  document.getElementById("tags");

const candidateCountElement =
  document.getElementById("candidate-count");


// 現在の条件に合う質問を取得
function getCandidates() {

  let candidates = questions;


  // タグが選ばれていたら絞り込み
  if (selectedTags.size > 0) {

    candidates = questions.filter(question => {

      return question.tags.some(tag =>
        selectedTags.has(tag)
      );

    });

  }


  // まだ引いていない質問だけ残す
  candidates = candidates.filter(
    question => !usedQuestions.has(question)
  );


  return candidates;
}


// 候補数を更新
function updateCandidateCount() {

  const candidates = getCandidates();

  candidateCountElement.textContent =
    candidates.length;

}


// フィルターボタン
filterButtons.forEach(button => {

  button.addEventListener("click", () => {

    const tag =
      button.dataset.tag;


    if (selectedTags.has(tag)) {

      selectedTags.delete(tag);

      button.classList.remove("active");

    } else {

      selectedTags.add(tag);

      button.classList.add("active");

    }


    updateCandidateCount();

  });

});


// 質問を引く
drawButton.addEventListener("click", () => {

  let candidates =
    getCandidates();


  // 全部引き終わった場合
  if (candidates.length === 0) {

    usedQuestions.clear();

    candidates =
      getCandidates();

  }


  if (candidates.length === 0) {

    questionElement.textContent =
      "その条件に合う質問がありません。";

    return;

  }


  const randomIndex =
    Math.floor(
      Math.random() * candidates.length
    );


  const question =
    candidates[randomIndex];


  usedQuestions.add(question);


  const originalIndex =
    questions.indexOf(question);


  numberElement.textContent =
    originalIndex + 1;


  questionElement.textContent =
    question.text;


  tagsElement.textContent =
    question.tags.join(" ／ ");


  updateCandidateCount();

});


updateCandidateCount();

</script>

</body>
</html>
