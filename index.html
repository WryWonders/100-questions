<html lang="ja">
<head>

  <meta name="theme-color" content="#111111">

  <title>🎁十年ぶり</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #111111;
      --card: #1b1b1b;
      --card-light: #242424;
      --text: #f5f5f5;
      --muted: #969696;
      --border: #3b3b3b;
      --active: #f5f5f5;
      --active-text: #111111;
    }

    body {
      margin: 0;
      padding:
        max(24px, env(safe-area-inset-top))
        18px
        max(30px, env(safe-area-inset-bottom));

      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Hiragino Sans",
        sans-serif;
    }

    button {
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .app {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.05em;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .section {
      margin-bottom: 24px;
    }

    .section-title {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      min-height: 42px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background: transparent;
      color: #dddddd;

      padding: 9px 14px;

      font-size: 14px;
      cursor: pointer;
    }

    .chip.active {
      background: var(--active);
      color: var(--active-text);
      border-color: var(--active);
      font-weight: 600;
    }

    .question-card {
      min-height: 290px;

      display: flex;
      flex-direction: column;

      border: 1px solid var(--border);
      border-radius: 24px;

      background: var(--card);

      padding: 26px 24px;
      margin-bottom: 18px;

      transition:
        opacity 0.15s ease,
        transform 0.15s ease;
    }

    .question-card.change {
      opacity: 0;
      transform: translateY(6px);
    }

    .question-number {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    .danger {
      margin-top: 8px;
      font-size: 13px;
      min-height: 20px;
    }

    .question-text {
      flex: 1;

      display: flex;
      align-items: center;

      padding: 28px 0;

      font-size: 25px;
      font-weight: 650;
      line-height: 1.55;
    }

    .question-tags {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.8;
    }

    .draw-button {
      width: 100%;
      min-height: 58px;

      border: none;
      border-radius: 18px;

      background: #f5f5f5;
      color: #111111;

      font-size: 18px;
      font-weight: 700;

      cursor: pointer;
    }

    .save-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;

      margin-top: 10px;
    }

    .save-button {
      min-height: 48px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: transparent;
      color: var(--text);

      font-size: 14px;

      cursor: pointer;
    }

    .save-button.active {
      background: var(--card-light);
      border-color: #777777;
      font-weight: 650;
    }

    .save-button:disabled {
      opacity: 0.35;
    }

    .status {
      margin: 15px 0 28px;

      color: var(--muted);

      font-size: 13px;
      text-align: center;
    }

    .reset-button {
      display: block;

      margin: 0 auto 30px;

      border: none;
      background: transparent;

      color: #777777;
      text-decoration: underline;

      font-size: 13px;

      cursor: pointer;
    }

    details {
      border-top: 1px solid var(--border);
      padding-top: 18px;
      margin-top: 12px;
    }

    summary {
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      padding: 6px 0 14px;
    }

    .saved-group {
      margin: 18px 0 26px;
    }

    .saved-heading {
      margin-bottom: 10px;
      font-size: 14px;
      color: var(--muted);
    }

    .saved-list {
      display: grid;
      gap: 8px;
    }

    .saved-item {
      width: 100%;

      text-align: left;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: var(--card);
      color: var(--text);

      padding: 13px 14px;

      font-size: 14px;
      line-height: 1.5;

      cursor: pointer;
    }

    .empty {
      color: #666666;
      font-size: 13px;
    }

    @media (max-width: 380px) {
      .question-text {
        font-size: 22px;
      }

      .chip {
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .question-card {
        transition: none;
      }
    }
  </style>
</head>

</div>

/* ----------------------------------------
   状態
---------------------------------------- */

let activeCategory = "全部";

let maxDanger = 5;

let currentQuestion = null;


/* ----------------------------------------
   localStorage
---------------------------------------- */

function loadSet(key) {

  try {

    const data =
      JSON.parse(localStorage.getItem(key) || "[]");

    return new Set(data);

  } catch {

    return new Set();

  }

}


function saveSet(key, set) {

  localStorage.setItem(
    key,
    JSON.stringify([...set])
  );

}


let usedQuestions =
  loadSet("10years-used");

let favoriteQuestions =
  loadSet("10years-favorites");

let laterQuestions =
  loadSet("10years-later");


/* ----------------------------------------
   DOM
---------------------------------------- */

const card =
  document.getElementById("question-card");

const questionNumber =
  document.getElementById("question-number");

const questionText =
  document.getElementById("question-text");

const questionDanger =
  document.getElementById("question-danger");

const questionTags =
  document.getElementById("question-tags");

const drawButton =
  document.getElementById("draw-button");

const favoriteButton =
  document.getElementById("favorite-button");

const laterButton =
  document.getElementById("later-button");

const resetButton =
  document.getElementById("reset-button");

const status =
  document.getElementById("status");

const startButton =
  document.getElementById("start-button");

/* ----------------------------------------
   フィルター
---------------------------------------- */

function matchesFilters(question) {

  const categoryOK =
    activeCategory === "全部"
    ||
    question.tags.includes(activeCategory);


  const dangerOK =
    question.danger <= maxDanger;


  return categoryOK && dangerOK;

}


function getUnusedCandidates() {

  return questions.filter(question =>

    matchesFilters(question)
    &&
    !usedQuestions.has(question.id)

  );

}


function getAllMatchingQuestions() {

  return questions.filter(matchesFilters);

}


/* ----------------------------------------
   ステータス
---------------------------------------- */

function updateStatus() {

  const all =
    getAllMatchingQuestions();

  const unused =
    getUnusedCandidates();


  status.textContent =
    `条件該当 ${all.length}問 ／ 未使用 ${unused.length}問`;

}


/* ----------------------------------------
   カテゴリ操作
---------------------------------------- */

document
  .querySelectorAll("[data-category]")
  .forEach(button => {

    button.addEventListener("click", () => {

      activeCategory =
        button.dataset.category;


      document
        .querySelectorAll("[data-category]")
        .forEach(item =>
          item.classList.remove("active")
        );


      button.classList.add("active");


      updateStatus();

    });

  });


/* ----------------------------------------
   危険度操作
---------------------------------------- */

document
  .querySelectorAll("[data-danger]")
  .forEach(button => {

    button.addEventListener("click", () => {

      maxDanger =
        Number(button.dataset.danger);


      document
        .querySelectorAll("[data-danger]")
        .forEach(item =>
          item.classList.remove("active")
        );


      button.classList.add("active");


      updateStatus();

    });

  });


/* ----------------------------------------
   質問表示
---------------------------------------- */

function displayQuestion(question) {

  currentQuestion = question;


  card.classList.add("change");


  setTimeout(() => {

    questionNumber.textContent =
      question.id;


    questionDanger.textContent =
      "🔥".repeat(question.danger)
      +
      `  危険度 ${question.danger}`;


    questionText.textContent =
      question.text;


    questionTags.textContent =
      question.tags.join(" ／ ");


    updateSaveButtons();


    card.classList.remove("change");

  }, 120);

}


/* ----------------------------------------
   ランダム抽選
---------------------------------------- */

drawButton.addEventListener("click", () => {

  const candidates =
    getUnusedCandidates();


  if (candidates.length === 0) {

    questionText.textContent =
      "この条件では、もう全部引きました。";

    questionDanger.textContent = "";

    questionTags.textContent =
      "カテゴリか危険度を変えるか、履歴をリセットしてください。";

    currentQuestion = null;

    updateSaveButtons();

    return;

  }


  const randomIndex =
    Math.floor(
      Math.random() * candidates.length
    );


  const selected =
    candidates[randomIndex];


  usedQuestions.add(selected.id);

  saveSet(
    "10years-used",
    usedQuestions
  );


  displayQuestion(selected);

  updateStatus();

});


/* ----------------------------------------
   お気に入り
---------------------------------------- */

favoriteButton.addEventListener("click", () => {

  if (!currentQuestion) {
    return;
  }


  const id =
    currentQuestion.id;


  if (favoriteQuestions.has(id)) {

    favoriteQuestions.delete(id);

  } else {

    favoriteQuestions.add(id);

  }


  saveSet(
    "10years-favorites",
    favoriteQuestions
  );


  updateSaveButtons();

  renderSavedLists();

});


/* ----------------------------------------
   あとで聞く
---------------------------------------- */

laterButton.addEventListener("click", () => {

  if (!currentQuestion) {
    return;
  }


  const id =
    currentQuestion.id;


  if (laterQuestions.has(id)) {

    laterQuestions.delete(id);

  } else {

    laterQuestions.add(id);

  }


  saveSet(
    "10years-later",
    laterQuestions
  );


  updateSaveButtons();

  renderSavedLists();

});


/* ----------------------------------------
   保存ボタン表示
---------------------------------------- */

function updateSaveButtons() {

  const enabled =
    Boolean(currentQuestion);


  favoriteButton.disabled =
    !enabled;

  laterButton.disabled =
    !enabled;


  if (!currentQuestion) {

    favoriteButton.textContent =
      "☆ お気に入り";

    laterButton.textContent =
      "⏰ あとで聞く";

    favoriteButton.classList.remove("active");

    laterButton.classList.remove("active");

    return;

  }


  if (
    favoriteQuestions.has(
      currentQuestion.id
    )
  ) {

    favoriteButton.textContent =
      "★ お気に入り済み";

    favoriteButton.classList.add("active");

  } else {

    favoriteButton.textContent =
      "☆ お気に入り";

    favoriteButton.classList.remove("active");

  }


  if (
    laterQuestions.has(
      currentQuestion.id
    )
  ) {

    laterButton.textContent =
      "✓ あとで聞く";

    laterButton.classList.add("active");

  } else {

    laterButton.textContent =
      "⏰ あとで聞く";

    laterButton.classList.remove("active");

  }

}


/* ----------------------------------------
   保存リスト
---------------------------------------- */

function renderSavedList(
  ids,
  elementId
) {

  const element =
    document.getElementById(elementId);


  element.innerHTML = "";


  const saved =
    questions.filter(question =>
      ids.has(question.id)
    );


  if (saved.length === 0) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "まだありません。";

    element.appendChild(empty);

    return;

  }


  saved.forEach(question => {

    const button =
      document.createElement("button");


    button.type =
      "button";


    button.className =
      "saved-item";


    button.textContent =
      `${question.id}. ${question.text}`;


    button.addEventListener(
      "click",
      () => {

        displayQuestion(question);

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      }
    );


    element.appendChild(button);

  });

}


function renderSavedLists() {

  renderSavedList(
    favoriteQuestions,
    "favorite-list"
  );


  renderSavedList(
    laterQuestions,
    "later-list"
  );


  document
    .getElementById("favorite-count")
    .textContent =
      favoriteQuestions.size;


  document
    .getElementById("later-count")
    .textContent =
      laterQuestions.size;

}


/* ----------------------------------------
   履歴リセット
---------------------------------------- */

resetButton.addEventListener("click", () => {

  const result =
    confirm(
      "引いた質問の履歴をリセットしますか？\nお気に入りと「あとで聞く」は残ります。"
    );


  if (!result) {
    return;
  }


  usedQuestions.clear();


  saveSet(
    "10years-used",
    usedQuestions
  );


  updateStatus();

});


/* ----------------------------------------
   スタート画面に戻る
---------------------------------------- */

startButton.addEventListener("click", () => {

  // 表示中の質問だけクリア
  currentQuestion = null;


  // カテゴリを「全部」に戻す
  activeCategory = "全部";


  document
    .querySelectorAll("[data-category]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.category === "全部"
      );

    });


  // 危険度を5に戻す
  maxDanger = 5;


  document
    .querySelectorAll("[data-danger]")
    .forEach(button => {

      button.classList.toggle(
        "active",
        Number(button.dataset.danger) === 5
      );

    });


  // 質問カードを初期状態へ
  questionNumber.textContent =
    "—";


  questionDanger.textContent =
    "";


  questionText.textContent =
    "カテゴリと危険度を選んで、質問を引いてください。";


  questionTags.textContent =
    "";


  // 保存ボタンも初期状態へ
  updateSaveButtons();


  // ステータス更新
  updateStatus();


  // 画面上部へ戻る
  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

});
  

/* ----------------------------------------
   初期化
---------------------------------------- */

updateStatus();

updateSaveButtons();

renderSavedLists();

</script>
